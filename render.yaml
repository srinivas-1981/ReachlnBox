services:
  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: []

  - type: web
    name: reachinbox-backend
    runtime: node
    plan: free
    rootDir: reachinbox-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://reachinbox-frontend.onrender.com
      - key: MITRAJIT_EMAIL
        value: Mitrajit
      - key: MITRAJIT_PASSWORD
        value: Yadav036
      - key: YADAV036_EMAIL
        value: Yadav036
      - key: YADAV036_PASSWORD
        value: Yadav036
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false

  - type: web
    name: reachinbox-frontend
    runtime: node
    plan: free
    rootDir: reachinbox-frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://reachinbox-backend.onrender.com/api/v1

databases:
  - name: reachinbox-db
    plan: free
    databaseName: reachinbox
    user: reachinbox_user
